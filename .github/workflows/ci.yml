name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vitest (coverage thresholds from angular.json)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Test build and static-site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prerendered against the mock API: deterministic content for the tests below.
      - run: npm run build:mock
      - run: npm run measure:bundle
      - name: Prerendered pages, GitHub Pages behaviour, axe-core
        run: npm run test:static
        env:
          SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v6
        with:
          name: test-build
          path: dist/
          include-hidden-files: true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: test-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: test-build
          path: dist/
      - run: npm run lighthouse
        env:
          SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/

  # Deploys to GitHub Pages after every green push to the default branch (main or master).
  # One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    needs: [quality, unit, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # A project site lives under /<repo>/; a user site (<user>.github.io) or a custom domain under /.
      # Override with the repository variable PAGES_BASE_HREF, e.g. "/" for a custom domain.
      BASE_HREF: ${{ vars.PAGES_BASE_HREF || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      # Prerendered against the real dummyjson; PUBLIC_URL makes Open Graph URLs absolute.
      - run: npm run build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run check:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/larder/browser
          include-hidden-files: true
          # Keep .nojekyll: without it Pages runs the site through Jekyll.
          include-hidden-files: true
      - uses: actions/deploy-pages@v4
        id: deployment
