# CI: quality gates on every push and pull request; deploy to GitHub Pages from the default branch.
#
# One-time repository setup:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Environments → github-pages → Deployment branches: allow the default branch (master)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vitest (coverage thresholds from angular.json)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prerendered against the mock API: deterministic content for the tests below.
      - run: npm run build:mock
      - run: npm run measure:bundle
      - name: Prerendered pages, GitHub Pages behaviour, axe-core
        run: npm run test:static
        env:
          SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: dist/
          include-hidden-files: true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: test-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: test-build
          path: dist/
      - run: npm run lighthouse
        env:
          SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/

  # Deploys to GitHub Pages after every green push to the default branch (main or master).
  # One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    needs: [quality, unit, build, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # A project site lives under /<repo>/; a user site (<user>.github.io) or a custom domain under /.
      # Override with the repository variable PAGES_BASE_HREF, e.g. "/" for a custom domain.
      BASE_HREF: ${{ vars.PAGES_BASE_HREF || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      # Prerendered against the real dummyjson; PUBLIC_URL makes Open Graph URLs absolute.
      - run: npm run build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run check:pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/larder/browser
          # Newer versions drop dotfiles by default, and .nojekyll must reach Pages.
          include-hidden-files: true
      - uses: actions/deploy-pages@v5
        id: deployment
