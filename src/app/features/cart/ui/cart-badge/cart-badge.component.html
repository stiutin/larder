@if (cart.count()) {
  <span class="badge" aria-live="polite">
    <span aria-hidden="true">{{ cart.count() }}</span>
    <span class="visually-hidden">items: {{ cart.count() }}</span>
  </span>
}
@if (pending()) {
  <span class="badge__pending" title="Some changes have not reached the server yet">
    <span class="visually-hidden">unsent changes</span>
  </span>
}
