<button [attr.aria-label]="label()" [title]="label()" (click)="toggle()" class="toggle" type="button">
  <!-- Inline SVG, not ☀ / ☾ / ◐ glyphs: those depend on the fonts installed on the device. -->
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
    @switch (preference()) {
      @case ('light') {
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      }
      @case ('dark') {
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      }
      @default {
        <circle cx="12" cy="12" r="9" />
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
      }
    }
  </svg>
</button>
