@if (updateReady()) {
  <div class="update" role="status">
    <span>A new version of the app is available.</span>
    <button (click)="reload()" class="update__button update__button--primary" type="button">Reload</button>
    <button (click)="dismiss()" class="update__button" type="button">Later</button>
  </div>
}
