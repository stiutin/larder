<header class="header">
  <div class="header__inner">
    <a [attr.aria-label]="appName + ' - home'" class="brand" routerLink="/">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor" />
        <path d="M6 8h20v6H6z" fill="#D9622B" />
        <path d="M6 14q3.33 4.6 6.67 0 3.33 4.6 6.66 0 3.34 4.6 6.67 0z" fill="#D9622B" />
        <rect x="7" y="20" width="18" height="2.6" rx="1.3" class="brand__counter" />
      </svg>
      <span class="brand__name">{{ appName }}</span>
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a
        [routerLinkActiveOptions]="{exact: true}"
        class="nav__link"
        routerLink="/"
        routerLinkActive="nav__link--active"
        ariaCurrentWhenActive="page"
      >
        Catalogue
      </a>
      <a class="nav__link" routerLink="/about" routerLinkActive="nav__link--active" ariaCurrentWhenActive="page">
        About
      </a>
      <a class="nav__link" routerLink="/contact" routerLinkActive="nav__link--active" ariaCurrentWhenActive="page">
        Contact
      </a>
      <a class="nav__link" routerLink="/cart" routerLinkActive="nav__link--active" ariaCurrentWhenActive="page">
        Cart
        @defer (on idle) {
          <app-cart-badge />
        }
      </a>
    </nav>

    <app-theme-toggle />
  </div>

  @if (!online()) {
    <p class="header__offline" role="status">Offline · showing saved data</p>
  }
</header>
