<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Larder</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A product catalogue that works offline: browse, search and fill your cart without a connection."
    />
    <meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Larder" />
    <meta
      property="og:description"
      content="A product catalogue that works offline: browse, search and fill your cart without a connection."
    />
    <meta property="og:image" content="assets/brand/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Product images come from a CDN: open the connection while JS is still loading. -->
    <link rel="preconnect" href="https://cdn.dummyjson.com" crossorigin />
    <link rel="preconnect" href="https://dummyjson.com" crossorigin />
    <!-- Apply the theme before the first frame, otherwise dark mode flashes light. -->
    <script>
      try {
        var theme = localStorage.getItem('larder-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>The catalogue needs JavaScript to run.</noscript>
  </body>
</html>
